name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: Validate release version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve and validate version
        id: version
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import json
          import os
          import re
          import subprocess
          import sys
          import urllib.error
          import urllib.request

          try:
              proc = subprocess.run(
                  [
                      "cargo",
                      "metadata",
                      "--locked",
                      "--no-deps",
                      "--format-version",
                      "1",
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              )
          except (OSError, subprocess.CalledProcessError) as exc:
              sys.stderr.write(f"cargo metadata failed: {exc}\n")
              sys.exit(1)

          try:
              meta = json.loads(proc.stdout)
          except json.JSONDecodeError as exc:
              sys.stderr.write(f"invalid JSON from cargo metadata: {exc}\n")
              sys.exit(1)

          packages = meta.get("packages") or []
          target_manifest = os.path.abspath(os.path.join(os.getcwd(), "Cargo.toml"))
          root_id = (meta.get("resolve") or {}).get("root")

          pkg = None
          if root_id is not None:
              for candidate in packages:
                  if candidate.get("id") == root_id:
                      pkg = candidate
                      break
          if pkg is None:
              for candidate in packages:
                  manifest = candidate.get("manifest_path") or ""
                  if os.path.abspath(manifest) == target_manifest:
                      pkg = candidate
                      break
          if pkg is None:
              sys.stderr.write("root package not found in cargo metadata\n")
              sys.exit(1)

          version = str(pkg.get("version") or "").strip()
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              sys.stderr.write(f"invalid Cargo package version: {version}\n")
              sys.exit(1)

          event = os.environ.get("GITHUB_EVENT_NAME", "")
          ref = os.environ.get("GITHUB_REF", "")
          publish = event == "push" and (ref == "refs/heads/main" or ref.startswith("refs/tags/"))
          if event == "push" and ref.startswith("refs/tags/"):
              tag = ref[len("refs/tags/"):]
              if tag != f"v{version}":
                  sys.stderr.write(
                      f"release tag {tag} does not match the Cargo package version (expected v{version})\n"
                  )
                  sys.exit(1)

          if publish and ref == "refs/heads/main":
              repository = os.environ["GITHUB_REPOSITORY"]
              api = os.environ["GITHUB_API_URL"]
              request = urllib.request.Request(
                  f"{api}/repos/{repository}/releases/tags/v{version}",
                  headers={
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=30):
                      publish = False
                  sys.stdout.write(f"v{version} already has a release; skipping release jobs\n")
              except urllib.error.HTTPError as exc:
                  if exc.code != 404:
                      raise

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={version}\n")
              out.write(f"publish={str(publish).lower()}\n")
          sys.stdout.write(f"release version: v{version}\n")

  native:
    name: test, build, package (${{ matrix.platform }})
    needs: preflight
    if: github.event_name == 'workflow_dispatch' || needs.preflight.outputs.publish == 'true'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - shell: bash
            platform: linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - shell: pwsh
            platform: windows
            os: windows-2022
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          target: ${{ matrix.target }}

      - name: Verify x86_64 runner (linux)
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          [ "$arch" = "x86_64" ] || { echo "unexpected runner architecture: $arch"; exit 1; }

      - name: Verify x86_64 runner (windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne 'AMD64') {
            Write-Error "unexpected runner architecture: $($env:PROCESSOR_ARCHITECTURE)"
            exit 1
          }

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg libasound2-dev libgtk-3-dev libxkbcommon-x11-dev pkg-config cmake python3-pil xvfb x11-utils imagemagick libgl1-mesa-dri
          ffmpeg -version
          ffprobe -version

      - name: Install Windows build dependencies
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          if ($LASTEXITCODE -ne 0) { Write-Error 'choco install ffmpeg failed'; exit 1 }
          ffmpeg -version
          if ($LASTEXITCODE -ne 0) { Write-Error 'ffmpeg not on PATH or failed to run'; exit 1 }
          ffprobe -version
          if ($LASTEXITCODE -ne 0) { Write-Error 'ffprobe not on PATH or failed to run'; exit 1 }
          cmake --version
          if ($LASTEXITCODE -ne 0) { Write-Error 'cmake not on PATH or failed to run'; exit 1 }

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Test portable Windows PE checks
        shell: python
        run: |
          import subprocess
          import sys
          subprocess.run([sys.executable, "scripts/check-windows-pe.py", "--self-test"], check=True)

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --all-targets --locked

      - name: Build release binaries
        run: cargo build --release --bins --locked

      - name: Smoke the CLI (linux)
        if: matrix.platform == 'linux'
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          bin="target/release/kvr"
          "$bin" --help
          out="$("$bin" --version)"
          if [ "$out" != "kvr $VERSION" ]; then
            echo "kvr --version did not report the expected exact string: got '$out', expected 'kvr $VERSION'"
            exit 1
          fi
          echo "$out"

      - name: Smoke the CLI (windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          $bin = Join-Path 'target/release' 'kvr.exe'
          if (-not (Test-Path -LiteralPath $bin)) { Write-Error "missing $bin"; exit 1 }
          & $bin --help
          if ($LASTEXITCODE -ne 0) { Write-Error 'kvr --help failed'; exit 1 }
          $out = (& $bin --version) -join ' '
          if ($LASTEXITCODE -ne 0) { Write-Error 'kvr --version failed'; exit 1 }
          if ($out -ne ("kvr " + $env:VERSION)) {
            Write-Error ("kvr --version did not report the expected exact string: got '" + $out + "', expected 'kvr " + $env:VERSION + "'")
            exit 1
          }
          Write-Host $out

      - name: Package release archive (linux)
        if: matrix.platform == 'linux'
        env:
          RELEASE_VERSION: "v${{ needs.preflight.outputs.version }}"
        run: |
          set -euo pipefail
          bash scripts/package-release.sh "$RELEASE_VERSION" --bin-dir target/release --output-dir dist

      - name: Package branded AppImage (linux)
        if: matrix.platform == 'linux'
        env:
          RELEASE_VERSION: "v${{ needs.preflight.outputs.version }}"
        run: bash scripts/package-appimage.sh "$RELEASE_VERSION" --bin-dir target/release --output-dir dist

      - name: Smoke packaged GUI and native icon (linux)
        if: matrix.platform == 'linux'
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: python3 scripts/check-linux-gui.py "dist/kvr-gui-v${VERSION}-linux-x86_64.AppImage" --screenshot "$RUNNER_TEMP/kvr-appimage-gui.png"

      - name: Package release archive (windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          RELEASE_VERSION: "v${{ needs.preflight.outputs.version }}"
        run: |
          pwsh -NoProfile -File scripts/package-release.ps1 "$env:RELEASE_VERSION" -BinDir 'target/release' -OutputDir 'dist'

      - name: Verify checksum (linux)
        if: matrix.platform == 'linux'
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          sidecar="dist/kvr-v${VERSION}-linux-x86_64.tar.gz.sha256"
          [ -f "$sidecar" ] || { echo "missing checksum sidecar: $sidecar"; exit 1; }
          (cd dist && sha256sum -c --quiet "kvr-v${VERSION}-linux-x86_64.tar.gz.sha256")

      - name: Verify checksum (windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          $sidecar = Join-Path 'dist' "kvr-v${env:VERSION}-windows-x86_64.zip.sha256"
          if (-not (Test-Path -LiteralPath $sidecar)) {
            Write-Error "missing checksum sidecar: $sidecar"
            exit 1
          }
          $archive = $sidecar -replace '\.sha256$', ''
          $parts = ([System.IO.File]::ReadAllText($sidecar).Trim() -split '\s+')
          if ($parts.Count -ne 2 -or $parts[1] -ne [System.IO.Path]::GetFileName($archive)) {
            Write-Error "unexpected checksum sidecar: $sidecar"
            exit 1
          }
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($parts[0] -ne $actual) {
            Write-Error "checksum mismatch for $([System.IO.Path]::GetFileName($archive))"
            exit 1
          }

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kvr-v${{ needs.preflight.outputs.version }}-${{ matrix.platform }}-x86_64
          path: dist
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [preflight, native]
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    concurrency:
      group: release-v${{ needs.preflight.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout (for --verify-tag)
        uses: actions/checkout@v4

      - name: Download linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: kvr-v${{ needs.preflight.outputs.version }}-linux-x86_64
          path: release/linux

      - name: Download windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: kvr-v${{ needs.preflight.outputs.version }}-windows-x86_64
          path: release/windows

      - name: Verify expected archives and checksums
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          files=(
            "release/linux/kvr-v${VERSION}-linux-x86_64.tar.gz"
            "release/linux/kvr-gui-v${VERSION}-linux-x86_64.AppImage"
            "release/windows/kvr-v${VERSION}-windows-x86_64.zip"
            "release/windows/kvr-v${VERSION}-windows-x86_64.exe"
            "release/windows/kvr-gui-v${VERSION}-windows-x86_64.exe"
          )
          for file in "${files[@]}"; do
            [ -f "$file" ] && [ -f "$file.sha256" ] || { echo "missing asset or checksum: $file"; exit 1; }
            (cd "$(dirname "$file")" && sha256sum -c --quiet "$(basename "$file").sha256")
          done

      - name: Aggregate SHA256SUMS
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release/files
          for file in \
            "release/linux/kvr-v${VERSION}-linux-x86_64.tar.gz" \
            "release/linux/kvr-gui-v${VERSION}-linux-x86_64.AppImage" \
            "release/windows/kvr-v${VERSION}-windows-x86_64.zip" \
            "release/windows/kvr-v${VERSION}-windows-x86_64.exe" \
            "release/windows/kvr-gui-v${VERSION}-windows-x86_64.exe"; do
            cp "$file" "$file.sha256" release/files/
          done
          cat release/files/*.sha256 > release/files/SHA256SUMS
          (cd release/files && sha256sum -c --quiet SHA256SUMS)

      - name: Smoke the release CLI
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          tar -xzf "release/files/kvr-v${VERSION}-linux-x86_64.tar.gz" -C release/files
          cli="release/files/kvr-v${VERSION}-linux-x86_64/kvr"
          [ -x "$cli" ] || { echo "extracted CLI is missing or not executable: $cli"; exit 1; }
          "$cli" --help
          out="$("$cli" --version)"
          if [ "$out" != "kvr $VERSION" ]; then
            echo "kvr --version did not report the expected exact string: got '$out', expected 'kvr $VERSION'"
            exit 1
          fi
          echo "$out"

      - name: Publish to GitHub Releases
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          # Concurrent main/tag runs must never replace published assets.
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "release ${tag} already exists; leaving existing assets untouched"
            exit 0
          fi

          # Main builds create the tag only after both platform jobs pass.
          # Never publish binaries from a different commit under an existing tag.
          if git ls-remote --exit-code origin "refs/tags/${tag}" >/dev/null; then
            git fetch origin "refs/tags/${tag}:refs/tags/${tag}" --depth 1
          else
            status=$?
            [ "$status" -eq 2 ] || exit "$status"
            git tag "${tag}" HEAD
            git push origin "refs/tags/${tag}"
          fi
          if [ "$(git rev-parse "${tag}^{commit}")" != "$(git rev-parse HEAD)" ]; then
            echo "tag ${tag} points to a different commit; bump the Cargo version"
            exit 1
          fi
          files=(
            "release/files/kvr-v${VERSION}-linux-x86_64.tar.gz"
            "release/files/kvr-v${VERSION}-linux-x86_64.tar.gz.sha256"
            "release/files/kvr-v${VERSION}-windows-x86_64.zip"
            "release/files/kvr-v${VERSION}-windows-x86_64.zip.sha256"
            "release/files/kvr-gui-v${VERSION}-linux-x86_64.AppImage"
            "release/files/kvr-gui-v${VERSION}-linux-x86_64.AppImage.sha256"
            "release/files/kvr-v${VERSION}-windows-x86_64.exe"
            "release/files/kvr-v${VERSION}-windows-x86_64.exe.sha256"
            "release/files/kvr-gui-v${VERSION}-windows-x86_64.exe"
            "release/files/kvr-gui-v${VERSION}-windows-x86_64.exe.sha256"
            "release/files/SHA256SUMS"
          )
          notes="$RUNNER_TEMP/kvr-release-notes.md"
          cat > "$notes" <<EOF
          ## Direct downloads

          | Application | Download |
          | --- | --- |
          | Windows GUI | [Standalone EXE](https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/kvr-gui-v${VERSION}-windows-x86_64.exe) |
          | Linux GUI | [AppImage](https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/kvr-gui-v${VERSION}-linux-x86_64.AppImage) |
          | Windows CLI | [Standalone EXE](https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/kvr-v${VERSION}-windows-x86_64.exe) |

          The GUI uses the original Kagan Erkan pixel logo for its native window and packaged application icons.
          ZIP and tar.gz bundles remain available. Each binary download has a SHA256 sidecar; SHA256SUMS covers all five downloads.
          Linux: make the AppImage executable before launching. File managers without AppImage integration may still show a generic file-type icon.

          [Licenses and third-party notices](https://github.com/${GITHUB_REPOSITORY}/blob/${tag}/THIRD_PARTY_NOTICES.md)
          EOF
          gh release create "${tag}" \
            --title "${tag}" \
            --verify-tag \
            --generate-notes \
            --notes-file "$notes" \
            "${files[@]}"
